name: Validate resource metadata

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
  pull_request: {}

jobs:
  validate:
    if: >-
      github.event_name != 'push' || (github.event.head_commit != null && !contains(github.event.head_commit.message, '[skip ci]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate resource pages
        run: |
          python3 scripts/generate_resource_pages.py

      - name: Validate manifest and links
        run: |
          python3 scripts/check_resource_manifest.py
          python3 scripts/check_resource_pages.py
          python3 scripts/check_public_link_release_queue.py
          python3 scripts/check_links.py

      - name: Ensure generated pages are committed
        run: |
          git diff --exit-code -- ZJE_Collection/ZIPS_INDEX.md ZJE_Collection/resources ZJE_Collection/zip_contents/index.md resource_migration_reports/resource_status.md
